worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Global upload limit — a typed interview answer won't come close to this
    client_max_body_size 5m;

    # --- Rate limit zones ---
    # General API: 10 req/s per IP — covers all /api/ traffic
    limit_req_zone $binary_remote_addr zone=api_limit:5m    rate=10r/s;
    # Auth endpoints: 5 req/min per IP — brute-force and credential-stuffing protection
    limit_req_zone $binary_remote_addr zone=auth_limit:5m   rate=5r/m;
    # Evaluate: 20 req/min per IP — each request hits the embedding + optionally Claude API
    limit_req_zone $binary_remote_addr zone=evaluate_limit:5m rate=20r/m;
    # Return 429 (Too Many Requests) instead of nginx default 503 when a zone fires
    limit_req_status 429;

    # Single backend target — K8s Service handles pod-level load balancing (round-robin by default)
    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # ----- Root — serve Front.dc.html for bare requests; pass OAuth callbacks to React
        # OAuth2 redirects land on /?token=xxx&username=yyy — those must reach index.html
        # so the React app can extract and store the token. Everything else gets Front.dc.html.
        location = / {
            root /usr/share/nginx/html;
            if ($args) {
                rewrite ^ /index.html last;
            }
            try_files /Front.dc.html =404;
        }

        # ----- React SPA
        # All other routes fall through to index.html so React Router handles them.
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ------- OAuth2 Proxy
        # Spring Security handles /oauth2/ and /login/oauth2/ internally.
        # Must be proxied to the backend — nginx cannot serve these as static files.
        location /oauth2/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /login/oauth2/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------- Auth endpoints — strict per-IP rate limit (brute force / credential stuffing)
        # 5r/m = 1 attempt every 12 seconds. burst=3 allows a short burst (e.g. retry after typo).
        # nodelay: burst requests are served immediately but counted against the bucket.
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=3 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
        }

        # ------- Evaluate endpoint — protect embedding + Claude API cost
        # 20r/m per IP ≈ 1 submission every 3 seconds. burst=5 allows back-to-back practice.
        # Both zones apply: evaluate_limit is the tighter constraint.
        location /api/v1/practice/evaluate {
            limit_req zone=evaluate_limit burst=5 nodelay;
            limit_req zone=api_limit      burst=5 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    120s;  # Claude can be slow; 60s was too tight
        }

        # ------- API Proxy (catch-all)
        # All /api/ requests not matched above are forwarded to the Spring Boot container.
        # The browser never talks to port 8080 directly.
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;

            # Forward real client info to Spring Boot
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # ----- SSL note 
        # In production on AWS, the ALB terminates SSL before traffic reaches nginx.
        # nginx only ever sees plain HTTP on port 80 inside the cluster — no certs needed here.
        #
        # If you ever run nginx on a bare VPS without a load balancer:
        #
        # listen 443 ssl;
        # ssl_certificate     /etc/ssl/certs/cert.pem;
        # ssl_certificate_key /etc/ssl/private/key.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;
    }
}