worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Global upload limit — a typed interview answer won't come close to this
    client_max_body_size 5m;

    # Rate limit: 10 requests/sec per IP, zone uses 5MB of shared memory
    limit_req_zone $binary_remote_addr zone=api_limit:5m rate=10r/s;

    # Single backend target — K8s Service handles pod-level load balancing (round-robin by default)
    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # ----- React SPA
        # All other routes fall through to index.html so React Router handles them.
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ------- OAuth2 Proxy
        # Spring Security handles /oauth2/ and /login/oauth2/ internally.
        # Must be proxied to the backend — nginx cannot serve these as static files.
        location /oauth2/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /login/oauth2/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ------- API Proxy
        # All /api/ requests are forwarded to the Spring Boot container.
        # The browser never talks to port 8080 directly.
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;

            # Forward real client info to Spring Boot
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # ----- SSL note 
        # In production on AWS, the ALB terminates SSL before traffic reaches nginx.
        # nginx only ever sees plain HTTP on port 80 inside the cluster — no certs needed here.
        #
        # If you ever run nginx on a bare VPS without a load balancer:
        #
        # listen 443 ssl;
        # ssl_certificate     /etc/ssl/certs/cert.pem;
        # ssl_certificate_key /etc/ssl/private/key.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;
    }
}